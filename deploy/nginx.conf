# Nginx reverse proxy for restauranteandaluz.es -> Node app on 127.0.0.1:4000.
#
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/restauranteandaluz.es
#          sudo ln -s /etc/nginx/sites-available/restauranteandaluz.es /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see README) — it edits this file in place to add the HTTPS
# server block and the http->https redirect. Don't hand-add SSL directives here first.

server {
    listen 80;
    listen [::]:80;
    server_name restauranteandaluz.es www.restauranteandaluz.es;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
